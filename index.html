<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>몽글 마트 무인 계산대</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 공통 상단 헤더 -->
  <header class="site-header">
    <div class="header-inner">
      <a class="brand-link" href="index.html">
        <span class="brand-dot" aria-hidden="true"></span>
        <span>몽글 마트</span>
      </a>
    </div>
  </header>

  <!-- 시작 화면 본문 -->
  <main class="main-container home-main">
    <section class="hero-card">
      <h1 class="hero-title">상품을 카메라에 비춰 주세요</h1>
      <p class="hero-desc">AI가 상품을 자동으로 알아보고 장바구니에 담아 합계를 계산해 드립니다.</p>
      <div class="hero-actions">
        <a class="btn-primary" href="scan.html">계산 시작</a>
      </div>
    </section>

    <section class="steps-grid" aria-label="이용 방법">
      <article class="step-card">
        <span class="step-badge">1</span>
        <h2 class="step-title">1 상품 비추기</h2>
        <p class="step-desc">계산할 상품을 카메라 앞 정사각형 화면에 비춰 주세요.</p>
      </article>
      <article class="step-card">
        <span class="step-badge">2</span>
        <h2 class="step-title">2 장바구니 확인</h2>
        <p class="step-desc">인식된 상품과 수량, 합계 금액을 한눈에 확인해요.</p>
      </article>
      <article class="step-card">
        <span class="step-badge">3</span>
        <h2 class="step-title">3 결제하기</h2>
        <p class="step-desc">확인 후 결제하기 버튼을 누르면 계산이 끝납니다.</p>
      </article>
    </section>

    <footer class="home-footer">
      <a class="footer-link" href="test.html">인식 테스트</a>
      <p class="footer-notice">실습용 서비스입니다. 실제 결제는 이루어지지 않습니다.</p>
    </footer>
  </main>
</body>
</html>
