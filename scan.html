<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>계산하기 - 몽글 마트 무인 계산대</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 공통 상단 헤더 -->
  <header class="site-header">
    <div class="header-inner">
      <a class="brand-link" href="index.html">
        <span class="brand-dot" aria-hidden="true"></span>
        <span>몽글 마트</span>
      </a>
    </div>
  </header>

  <!-- 계산 화면 본문 (넓은 화면: 좌우 나란히, 모바일: 위아래 쌓기) -->
  <main class="main-container">
    <div class="scan-layout">
      <!-- 왼쪽: 카메라 인식 영역 -->
      <section class="kiosk-card" aria-label="상품 인식 카메라">
        <h1 class="card-title">상품 스캔</h1>
        <div class="camera-section">
          <div class="camera-box">
            <video id="scanVideo" class="camera-video" playsinline muted autoplay></video>
            <!-- 상품이 담겼을 때 1.5초 동안 크게 보여주는 안내 배너 -->
            <div id="addedBanner" class="added-banner" hidden aria-live="assertive"></div>
          </div>
        </div>
        <!-- 유지 시간 동안 0% ~ 100% 차오르는 진행 막대 -->
        <div id="holdProgressWrap" class="hold-progress-wrap" hidden aria-label="인식 유지 진행률">
          <div class="hold-progress-track">
            <div id="holdProgressFill" class="hold-progress-fill"></div>
          </div>
        </div>
        <div id="scanStatusLine" class="scan-status-line" data-state="idle" role="status" aria-live="polite">
          모델 불러오는 중...
        </div>
      </section>

      <!-- 오른쪽: 장바구니 영역 -->
      <section class="kiosk-card cart-card" aria-label="장바구니">
        <h2 class="card-title">장바구니</h2>
        <div id="cartBody" class="cart-body">
          <p id="cartEmptyText" class="cart-empty-text">아직 담은 상품이 없어요</p>
          <ul id="cartList" class="cart-list" hidden></ul>
        </div>
        <div class="cart-footer">
          <div class="cart-summary-row">
            <span class="cart-summary-label">총 수량</span>
            <span id="cartTotalCount" class="cart-summary-value">0개</span>
          </div>
          <div class="cart-total-row">
            <span class="cart-total-label">합계</span>
            <span id="cartTotalAmount" class="cart-total-amount">0원</span>
          </div>
          <button id="payButton" type="button" class="btn-primary cart-pay-btn" disabled>결제하기</button>
        </div>
      </section>
    </div>
  </main>

  <!-- Teachable Machine 이미지 모델 실행에 필요한 라이브러리 (주소와 버전 유지) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>
  <!-- 설정, 상품 가격표, 판정 규칙, 장바구니, 카메라 모듈 -->
  <script src="js/config.js"></script>
  <script src="js/products.js"></script>
  <script src="js/judge.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/recognizer.js"></script>
  <!-- 계산 화면 전용 스크립트 -->
  <script src="js/scan.js"></script>
</body>
</html>
