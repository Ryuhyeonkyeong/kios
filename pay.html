<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>결제하기 - 몽글 마트 무인 계산대</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 공통 상단 헤더 -->
  <header class="site-header">
    <div class="header-inner">
      <a class="brand-link" href="index.html">
        <span class="brand-dot" aria-hidden="true"></span>
        <span>몽글 마트</span>
      </a>
    </div>
  </header>

  <main class="main-container center-main">
    <!-- 장바구니가 비어 있을 때 보여줄 안내 카드 -->
    <section id="emptyPayCard" class="kiosk-card empty-state-card" hidden>
      <h1 class="empty-state-title">담은 상품이 없어요</h1>
      <p class="empty-state-desc">계산 화면에서 상품을 먼저 담아 주세요.</p>
      <a class="btn-primary" href="scan.html">계산 화면으로 가기</a>
    </section>

    <!-- 주문 내역과 결제 수단을 고르는 카드 -->
    <section id="payContentCard" class="kiosk-card pay-card" hidden>
      <h1 class="card-title">주문 확인 및 결제</h1>

      <!-- 주문 내역 목록 -->
      <div class="order-summary-box">
        <h2 class="section-title">주문 내역</h2>
        <ul id="orderItemList" class="order-item-list"></ul>
        <div class="order-total-box">
          <div class="cart-summary-row">
            <span class="cart-summary-label">총 수량</span>
            <span id="orderTotalCount" class="order-total-count">0개</span>
          </div>
          <div class="cart-total-row">
            <span class="cart-total-label">결제 금액</span>
            <span id="orderTotalAmount" class="order-total-amount">0원</span>
          </div>
        </div>
      </div>

      <!-- 결제 수단 선택 -->
      <div class="payment-method-section">
        <h2 class="section-title">결제 수단을 선택해 주세요</h2>
        <div id="paymentMethods" class="payment-methods-grid" role="radiogroup" aria-label="결제 수단">
          <button type="button" class="payment-method-btn" data-method="카드">카드</button>
          <button type="button" class="payment-method-btn" data-method="간편결제">간편결제</button>
          <button type="button" class="payment-method-btn" data-method="현금">현금</button>
        </div>
      </div>

      <!-- 하단 버튼 -->
      <div class="pay-actions">
        <a id="moreItemsBtn" class="btn-secondary" href="scan.html">상품 더 담기</a>
        <button id="confirmPayBtn" type="button" class="btn-primary" disabled>결제하기</button>
      </div>
    </section>
  </main>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/pay.js"></script>
</body>
</html>
